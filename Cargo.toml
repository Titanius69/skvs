[package]
name = "skvs"
version = "0.3.0"
edition = "2021"
description = "Super KVS – Full SQL database with triggers, views, JSON, FTS, virtual tables"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=2.14.2", features = ["serde-json"] }
napi-derive = "=2.14.0"
napi-derive-backend = "=1.0.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dashmap = "5"
arc-swap = "1"
bincode = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
uuid = { version = "=1.6.1", features = ["v4"] }
getrandom = "=0.2.15"
unicode-segmentation = "=1.10.1"
tracing = "0.1"
tracing-subscriber = "0.3"
sqlparser = "=0.40.0"
indexmap = { version = "=2.2.6", features = ["serde"] }
base64 = "0.21"
lru = "0.12"
once_cell = "1.19"
regex = "1.10"
hex = "0.4"
async-trait = "0.1"

[build-dependencies]
napi-build = "=2.1.3"